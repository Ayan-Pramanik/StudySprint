# StudySprint behind nginx: exposes the local server (npm start, 127.0.0.1:8787)
# to other devices. Installed by deploy/nginx/install.sh.

upstream studysprint {
    server 127.0.0.1:8787;
    keepalive 16;
}

# A tunnel on this machine (e.g. cloudflared) terminates HTTPS and connects from loopback;
# keep the scheme it reports. Anyone else gets the scheme they actually reached nginx on.
map "$remote_addr:$http_x_forwarded_proto" $studysprint_proto {
    "~^(127\.0\.0\.1|::1):https$" https;
    default $scheme;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Markdown/zip and backup imports go up to ~2.9 MB; nginx's 1 MB default would reject them.
    client_max_body_size 8m;

    location / {
        proxy_pass http://studysprint;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # The API compares the browser's Origin with the host and scheme it was reached on,
        # so pass both through unchanged ($http_host keeps a non-default port).
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $studysprint_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;

        # AI generation can take up to ~50 s (25 s timeout, one retry).
        proxy_read_timeout 90s;
    }
}

# HTTPS, once you have a domain pointing at this machine:
#   sudo apt install certbot python3-certbot-nginx
#   set server_name above to your domain, then: sudo certbot --nginx -d your.domain
# Certbot adds the 443 server block; X-Forwarded-Proto then tells the app it is on HTTPS,
# which also marks its workspace cookie Secure.
